<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter App</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon">

    <!-- Tailwind JS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#E7EFFC] min-h-screen flex items-center justify-center font-sans antialiased">
    <div
        class="flex flex-col items-center justify-center p-6 bg-[#E7EFFC] rounded-3xl shadow-[20px_20px_60px_#c5cbd6,-20px,-20px_60px_#ffffff]">
        <div class="flex items-center justify-center space-x-6 sm:space-x-8 mb-5 sm:mb-8">
            <!-- Decrease (-) Button - Neumorphic Style -->
            <button id="decrease"
                class="text-[#3B82F6] text-3xl sm:text-4xl font-extrabold w-20 h-20 sm:w-20 sm:h-20 transition-all duration-300 active:scale-95 focus:outline-none select-none rounded-xl shadow-[5px_5px_15px_#d1d9e6,-5px_-5px_15px_#ffffff] hover:shadow-[2px_2px_10px_#d1d9e6,-2px_-2px_10px_#ffffff] bg-[#E7EFFC]"
                aria-label="Decrease">
                <span class="block transform translate-y-[-2px]">&minus;</span>
            </button>

            <!-- Center Active Number Card (Keep Original Color, Enhancing Shadow) -->
            <div id="display"
                class="w-24 h-24 sm:w-28 sm:h-28 bg-[#3B72ED] text-white font-bold text-4xl sm:text-5xl flex items-center justify-center rounded-3xl shadow-[10px_10px_25px_rgba(59,114,237,0.3)] border-4 border-white/40 transition-transform duration-200 select-none">
                0</div>

            <!-- Increase (+) Button - Neumorphic Style -->
            <button id="increase"
                class="text-[#3B82F6] text-3xl sm:text-4xl font-extrabold w-20 h-20 sm:w-20 sm:h-20 transition-all duration-300 active:scale-95 focus:outline-none select-none rounded-xl shadow-[5px_5px_15px_#d1d9e6,-5px_-5px_15px_#ffffff] hover:shadow-[2px_2px_10px_#d1d9e6,-2px_-2px_10px_#ffffff] bg-[#E7EFFC]"
                aria-label="Increase">&#43;</button>
        </div>

        <!-- The Best Looking Reset Button - Modern Glass/Flat Combo -->
        <button id="reset"
            class="group flex items-center gap-2.5 px-[6em] sm:px-[7em] py-5 bg-white/40 backdrop-blur-md text-[#3B72ED] hover:text-white font-semibold text-lg rounded-2xl shadow-[inset_0_1px_1px_rgba(255,255,255,0.7),_0_5px_10px_rgba(59,114,237,0.1)] border border-[#c3d3e6] transition-all duration-300 hover:bg-[#3B72ED] hover:scale-105 active:scale-95 focus:outline-none select-none">
            <svg class="w-5 h-5 transition-transform duration-500 group-hover:rotate-180" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                <path d="M3 21v-5h5" />
            </svg>
            Reset
        </button>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
